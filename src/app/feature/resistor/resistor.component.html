@let vm = viewModel();
<h1>Resistor Color Code Calculator</h1>

<app-mode-toggle
  [modes]="calculatorModes"
  [activeMode]="mode()"
  (modeChange)="setMode($event)"
/>

@if (mode() === 'forward') {
  <app-forward-form
    [form]="form"
    [viewModel]="vm"
    [digitColors]="digitColors"
    [multiplierColors]="multiplierColors"
    [toleranceColors]="toleranceColors"
    [tcrColors]="tcrColors"
    [bandCounts]="bandCounts"
    [applyFeedback]="applyFeedback()"
  />

  <app-result-card
    [ohms]="vm.ohms"
    [tolerancePct]="vm.tolerancePct"
    [tcrPpm]="vm.tcrPpm"
    [copyState]="copyState()"
    [isCopyEnabled]="isCopyEnabled()"
    [validationMessage]="validationMessage()"
    (copyResult)="copyResult()"
  />

  <app-help-section
    [showHelp]="showHelp()"
    [isAtDefaults]="isAtDefaults()"
    (toggleHelp)="toggleHelp()"
    (resetToDefaults)="resetToDefaults()"
  />
} @else {
  <app-reverse-shell
    [reverseForm]="reverseForm"
    [reverseViewModel]="reverseViewModel()"
    [reverseValidationMessage]="reverseValidationMessage()"
    [bandCounts]="bandCounts"
    [reverseModes]="reverseModes"
    (applyCandidate)="applyCandidate($event)"
  />
}
