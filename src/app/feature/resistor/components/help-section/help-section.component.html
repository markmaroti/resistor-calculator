<section
  class="resistor-help"
  aria-live="polite"
>
  <div class="help-actions">
    <button
      class="help-reset"
      type="button"
      (click)="resetToDefaults.emit()"
      [disabled]="isAtDefaults()"
    >
      Reset to defaults
    </button>
    <button
      class="help-trigger"
      type="button"
      (click)="toggleHelp.emit()"
      [attr.aria-expanded]="showHelp()"
    >
      {{ showHelp() ? 'Hide how it works' : 'Show how it works' }}
    </button>
    <a
      class="help-link"
      routerLink="/guide"
      >Open guide</a
    >
  </div>
  @defer (when showHelp()) {
    @if (showHelp()) {
      <div class="help-card">
        <h2>How it works</h2>
        <p>
          Each color band encodes a digit, a multiplier, and an optional tolerance/TCR value.
          Changing the bands updates the calculated resistance instantly.
        </p>
        <app-reference-panel />
      </div>
    }
  }
</section>
