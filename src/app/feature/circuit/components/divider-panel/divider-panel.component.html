<section class="circuit-calculator">
  @if (vout() !== null) {
    <div
      class="circuit-result circuit-result-double"
      aria-live="polite"
    >
      <div>
        <span class="result-label">Vout</span>
        <span class="result-value">{{ vout() | volts }}</span>
      </div>
      <div>
        <span class="result-label">Current</span>
        <span class="result-value">{{ current() | amps }}</span>
      </div>
    </div>
  } @else if (validationMessage()) {
    <div
      class="circuit-error"
      role="alert"
      aria-live="assertive"
    >
      {{ validationMessage() }}
    </div>
  } @else {
    <div class="circuit-placeholder">Enter voltage and resistor values.</div>
  }

  <ul class="circuit-controls">
    <li>
      <label>
        Vin
        <input
          type="text"
          [formField]="form().vin"
          class="circuit-input"
          placeholder="e.g. 5"
          autocomplete="off"
        />
      </label>
    </li>
    <li>
      <label>
        R1
        <input
          type="text"
          [formField]="form().r1"
          class="circuit-input"
          placeholder="e.g. 1000"
          autocomplete="off"
        />
      </label>
    </li>
    <li>
      <label>
        R2
        <input
          type="text"
          [formField]="form().r2"
          class="circuit-input"
          placeholder="e.g. 2000"
          autocomplete="off"
        />
      </label>
    </li>
  </ul>

  <div class="circuit-actions">
    <button
      type="button"
      class="action-reset"
      (click)="resetForm.emit()"
    >
      Reset
    </button>
  </div>
</section>
